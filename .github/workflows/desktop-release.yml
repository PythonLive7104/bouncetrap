name: Build Desktop App

# Builds the BounceTrap desktop app for Windows, macOS and Linux and attaches
# the installers to a GitHub Release. Triggered by pushing a tag like desktop-v1.0.0.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}   # also allow manual runs from the Actions tab

# Required so the release job can create a Release and upload the installers
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installer
        # --publish never: electron-builder only BUILDS; the separate `release`
        # job below uploads the installers to the GitHub Release.
        run: npm run dist -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bouncetrap-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
