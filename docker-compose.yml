services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bouncetrap}
      POSTGRES_USER: ${POSTGRES_USER:-bouncetrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bouncetrap}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bound to loopback only — reachable from the host (psql, pg_dump, manage.py)
    # but never exposed to the internet. Set POSTGRES_PORT in a root .env if
    # another Postgres already owns 5432 on this machine.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bouncetrap} -d ${POSTGRES_DB:-bouncetrap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --config gunicorn.conf.py"
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-bouncetrap}:${POSTGRES_PASSWORD:-bouncetrap}@db:5432/${POSTGRES_DB:-bouncetrap}
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"

  celery:
    build: ./backend
    command: celery -A config worker -Q verification -l info --concurrency 4
    env_file: ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-bouncetrap}:${POSTGRES_PASSWORD:-bouncetrap}@db:5432/${POSTGRES_DB:-bouncetrap}
    volumes:
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
