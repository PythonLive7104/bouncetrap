    <!-- Structured Data — FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How accurate is BounceTrap's email verification?",
          "acceptedAnswer": { "@type": "Answer", "text": "BounceTrap achieves 97%+ accuracy by combining a 10-step local pipeline (syntax, MX, SMTP, disposable blocklist, catch-all probing) with an extended deep verification layer. Emails that can be resolved locally never touch the external API, keeping costs low without sacrificing accuracy." }
        },
        {
          "@type": "Question",
          "name": "What file formats does the bulk upload support?",
          "acceptedAnswer": { "@type": "Answer", "text": "Bulk upload supports CSV and TXT files. For CSV files you can specify the column containing email addresses. For plain TXT files one email per line is expected. Files up to 500,000 rows are supported on the Pro plan." }
        },
        {
          "@type": "Question",
          "name": "Do I need a credit card to get started?",
          "acceptedAnswer": { "@type": "Answer", "text": "No. You can sign up for free and receive 100 verification credits immediately — no credit card required. Upgrade at any time when you need more capacity." }
        },
        {
          "@type": "Question",
          "name": "How does the REST API authentication work?",
          "acceptedAnswer": { "@type": "Answer", "text": "API authentication uses the X-API-Key request header. Generate keys from your dashboard under API Keys. Keys are stored as cryptographic hashes — the raw key is shown only once at creation time. Starter plan and above can generate API keys." }
        },
        {
          "@type": "Question",
          "name": "What is a catch-all email domain?",
          "acceptedAnswer": { "@type": "Answer", "text": "A catch-all domain accepts all incoming emails regardless of whether the individual mailbox exists, making it impossible to confirm address validity via SMTP. BounceTrap detects catch-all domains and marks those addresses as 'risky' rather than 'valid' to protect your sender reputation." }
        },
        {
          "@type": "Question",
          "name": "Can I cancel my subscription at any time?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. You can cancel or downgrade your plan at any time from your billing page. No lock-in contracts. Your credit balance never expires — unused credits are preserved when your subscription lapses and become available again the moment you renew." }
        },
        {
          "@type": "Question",
          "name": "What is a disposable email address?",
          "acceptedAnswer": { "@type": "Answer", "text": "A disposable email address is a temporary address from services like Mailinator, Guerrilla Mail, or 10MinuteMail. They are used to avoid spam but are worthless for marketing lists. BounceTrap checks against a blocklist of 50,000+ known disposable domains and flags them automatically." }
        },
        {
          "@type": "Question",
          "name": "How does BounceTrap reduce email bounce rates?",
          "acceptedAnswer": { "@type": "Answer", "text": "BounceTrap removes invalid addresses before you send. It performs live SMTP handshakes to confirm the mailbox exists, detects disposable and role-based addresses, and identifies catch-all domains. Removing these from your list before sending keeps your bounce rate below 2%, protecting your sender reputation and inbox placement." }
        },
        {
          "@type": "Question",
          "name": "What does the deliverability score mean?",
          "acceptedAnswer": { "@type": "Answer", "text": "The deliverability score is a number from 0 to 100 that represents the likelihood an email will be successfully delivered to the inbox. A score above 80 is considered safe to send. It is calculated from SMTP response, catch-all risk, role-based flags, disposable status, and free provider signals." }
        },
        {
          "@type": "Question",
          "name": "Can I verify emails via the API without a dashboard?",
          "acceptedAnswer": { "@type": "Answer", "text": "Yes. Use POST /api/v1/verify/single/ with your X-API-Key header and a JSON body containing the email field. The response includes status, score, sub_status, esp, flags, and more. Full OpenAPI documentation is available at bouncetrap.net/api/docs/." }
        },
        {
          "@type": "Question",
          "name": "What is SPF, DKIM, and DMARC and why do they matter?",
          "acceptedAnswer": { "@type": "Answer", "text": "SPF (Sender Policy Framework), DKIM (DomainKeys Identified Mail), and DMARC (Domain-based Message Authentication, Reporting, and Conformance) are DNS-based email authentication standards. Together they prove your emails are legitimate and prevent spoofing. BounceTrap's deliverability tools check all three for your sending domain and flag missing or misconfigured records." }
        },
        {
          "@type": "Question",
          "name": "How many emails can I verify per minute via the API?",
          "acceptedAnswer": { "@type": "Answer", "text": "Rate limits depend on your plan: Free plan allows 60 requests per minute, Starter 600/min, Growth 3,000/min, and Pro 12,000/min. For bulk processing of large lists, use the bulk upload endpoint which has no per-minute limit." }
        }
      ]
    }
